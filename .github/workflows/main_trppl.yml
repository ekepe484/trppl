name: Deploy Trppl to Azure

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build React frontend
        run: |
          cd trppl-react
          npm install
          npm run build

      - name: Remove unnecessary files before deploy
        run: |
          rm -rf trppl-react/node_modules
          rm -rf trppl-react/.git
          rm -rf .git
          find . -name "*.log" -delete
          find . -name ".DS_Store" -delete

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get publishing credentials
        id: creds
        run: |
          USER=$(az webapp deployment list-publishing-credentials \
            --resource-group trppl-rg \
            --name trppl-fngbaydqh3dxg0hh \
            --query publishingUserName -o tsv)
          PASS=$(az webapp deployment list-publishing-credentials \
            --resource-group trppl-rg \
            --name trppl-fngbaydqh3dxg0hh \
            --query publishingPassword -o tsv)
          echo "::add-mask::$PASS"
          echo "user=$USER" >> $GITHUB_OUTPUT
          echo "pass=$PASS" >> $GITHUB_OUTPUT

      - name: Create minimal zip
        run: |
          zip -r deploy.zip \
            backend/ \
            frontend/ \
            package.json \
            package-lock.json \
            scripts/
          echo "Size: $(du -sh deploy.zip)"

      - name: Upload via Kudu API
        run: |
          curl -X POST \
            --fail \
            --max-time 600 \
            --retry 3 \
            --retry-delay 10 \
            -u "${{ steps.creds.outputs.user }}:${{ steps.creds.outputs.pass }}" \
            -H "Content-Type: application/zip" \
            --data-binary @deploy.zip \
            "https://trppl-fngbaydqh3dxg0hh.scm.canadacentral-01.azurewebsites.net/api/zipdeploy"

      - name: Restart app
        run: |
          az webapp restart \
            --resource-group trppl-rg \
            --name trppl-fngbaydqh3dxg0hh

      - name: Log out
        run: az logout
