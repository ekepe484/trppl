name: Deploy Trppl to Azure

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build React frontend
        run: |
          cd trppl-react
          npm install
          npm run build
          cd ..

      - name: Create deploy zip (no node_modules - Azure installs them)
        run: |
          zip -r deploy.zip \
            backend/ \
            frontend/ \
            scripts/ \
            package.json \
            package-lock.json
          echo "Zip size: $(du -sh deploy.zip | cut -f1)"

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'trppl'
          package: deploy.zip

      - name: Log out
        run: az logout
