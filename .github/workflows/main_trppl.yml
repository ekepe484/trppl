name: Deploy Trppl to Azure

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        run: npm install --omit=dev

      - name: Build React frontend
        run: |
          cd trppl-react
          npm install
          npm run build
          cd ..

      - name: Assemble clean deploy folder
        run: |
          mkdir -p deploy_pkg
          # Backend
          cp -r backend deploy_pkg/
          cp -r node_modules deploy_pkg/
          cp package.json deploy_pkg/
          # Frontend (React build output)
          cp -r frontend deploy_pkg/
          # Scripts
          cp -r scripts deploy_pkg/ 2>/dev/null || true

      - name: Zip deploy folder
        run: |
          cd deploy_pkg
          zip -r ../deploy.zip .
          cd ..
          echo "Deploy zip size: $(du -sh deploy.zip | cut -f1)"

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'trppl'
          package: deploy.zip

      - name: Log out of Azure
        run: az logout
