name: Deploy Trppl to Azure

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install backend dependencies
        run: npm ci --omit=dev

      - name: Install React dependencies and build
        run: |
          cd trppl-react
          npm ci
          npm run build
          cd ..

      - name: Create deployment archive
        run: |
          zip -r deploy.zip . \
            --exclude "*.git*" \
            --exclude "node_modules/*" \
            --exclude "trppl-react/*" \
            --exclude "android/*" \
            --exclude "ios/*" \
            --exclude "uploads/*" \
            --exclude "*.zip"

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'trppl'
          package: deploy.zip

      - name: Log out of Azure
        run: az logout
