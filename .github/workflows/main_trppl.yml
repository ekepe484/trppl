name: Deploy Trppl to Azure

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build React frontend
        run: |
          cd trppl-react
          npm install
          npm run build

      - name: Remove unnecessary files before deploy
        run: |
          rm -rf trppl-react/node_modules
          rm -rf trppl-react/.git
          rm -rf .git
          find . -name "*.log" -delete
          find . -name ".DS_Store" -delete

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get publishing credentials
        id: creds
        run: |
          USER=$(az webapp deployment list-publishing-credentials \
            --resource-group trppl \
            --name trppl \
            --query publishingUserName -o tsv)
          PASS=$(az webapp deployment list-publishing-credentials \
            --resource-group trppl \
            --name trppl \
            --query publishingPassword -o tsv)
