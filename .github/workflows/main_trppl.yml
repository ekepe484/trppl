name: Deploy Trppl to Azure

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        run: npm install --omit=dev

      - name: Build React frontend
        run: |
          cd trppl-react
          npm install
          npm run build
          cd ..

      - name: Create deploy zip
        run: |
          zip -r deploy.zip \
            backend/ \
            frontend/ \
            node_modules/ \
            package.json \
            package-lock.json \
            scripts/
          echo "Zip size: $(du -sh deploy.zip | cut -f1)"

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get publishing credentials
        id: creds
        run: |
          USER=$(az webapp deployment list-publishing-credentials \
