<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a1a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/favicon.png">
<title>My Profile — Trppl</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/auth.css">
<link rel="stylesheet" href="/css/register.css">
<style>
.profile-header{background:#1a1a2e;padding:0 16px 20px;display:flex;align-items:flex-end;gap:16px;}
.profile-avatar-wrap{position:relative;margin-top:-40px;}
.profile-avatar{width:80px;height:80px;border-radius:50%;background:var(--p);display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:700;color:#fff;border:3px solid var(--bg);flex-shrink:0;}
.profile-meta{padding-bottom:4px;}
.profile-name{font-size:20px;font-weight:700;color:#fff;}
.profile-username{font-size:13px;color:#a78bfa;}
.profile-verified{display:inline-flex;align-items:center;gap:4px;background:rgba(22,163,74,.2);color:#86efac;border:1px solid rgba(134,239,172,.3);border-radius:20px;font-size:11px;font-weight:600;padding:2px 10px;margin-top:4px;}
.profile-pending{display:inline-flex;align-items:center;gap:4px;background:rgba(249,115,22,.15);color:#fed7aa;border:1px solid rgba(253,186,116,.3);border-radius:20px;font-size:11px;font-weight:600;padding:2px 10px;margin-top:4px;}
.back-btn{background:rgba(255,255,255,.1);border:none;color:#fff;padding:8px 14px;border-radius:20px;font-size:13px;font-family:var(--font);cursor:pointer;display:flex;align-items:center;gap:6px;margin:12px 16px 0;}
.back-btn:active{opacity:.7;}
.section-title{font-size:11px;font-weight:600;color:var(--tx3);letter-spacing:1px;text-transform:uppercase;padding:16px 16px 8px;}
.info-row{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--br);}
.info-row:last-child{border-bottom:none;}
.info-label{font-size:13px;color:var(--tx2);display:flex;align-items:center;gap:8px;}
.info-label i{font-size:16px;color:var(--p);}
.info-value{font-size:14px;color:var(--tx);font-weight:500;text-align:right;max-width:60%;}
.info-card{background:var(--bg);border:1px solid var(--br);border-radius:var(--rad);margin:0 14px 14px;overflow:hidden;}
.photo-grid-profile{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 14px 14px;}
.photo-slot-profile{aspect-ratio:1;border-radius:var(--rads);overflow:hidden;position:relative;background:var(--bg3);}
.photo-slot-profile img{width:100%;height:100%;object-fit:cover;display:block;}
.photo-del{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;background:rgba(220,38,38,.85);border:none;color:#fff;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.photo-add-slot{aspect-ratio:1;border-radius:var(--rads);border:2px dashed var(--br2);background:var(--bg2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;color:var(--tx3);}
.photo-add-slot i{font-size:22px;}
.photo-add-slot span{font-size:11px;}
.action-btn{width:calc(100% - 28px);margin:0 14px 10px;padding:14px;border-radius:var(--rad);border:none;font-size:15px;font-weight:600;font-family:var(--font);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;}
.btn-edit{background:var(--p);color:#fff;}
.btn-verify{background:#f97316;color:#fff;}
.btn-logout{background:var(--bg2);color:var(--r);border:1px solid var(--br2);}
.btn-save{background:var(--g);color:#fff;}
.btn-cancel{background:var(--bg2);color:var(--tx);border:1px solid var(--br2);}
.edit-section{display:none;padding:0 14px 14px;}
.edit-section.active{display:block;}
.success-msg{background:#dcfce7;border:1px solid #86efac;border-radius:var(--rads);padding:12px 14px;font-size:13px;color:#166534;margin:0 14px 12px;}
</style>
</head>
<body>
<div class="phone auth-phone" style="background:var(--bg3)">

  <!-- Top bar -->
  <div style="background:#1a1a2e;padding:14px 16px 0;display:flex;justify-content:space-between;align-items:center">
    <button class="back-btn" id="backBtn" style="margin:0;background:transparent;border:none">
      <i class="ti ti-arrow-left"></i> Back
    </button>
    <button class="back-btn" id="editToggleBtn" style="margin:0">
      <i class="ti ti-edit"></i> Edit
    </button>
  </div>

  <!-- Profile header -->
  <div style="background:#1a1a2e;padding:16px 16px 24px;display:flex;align-items:center;gap:16px">
    <div class="profile-avatar" id="profileAvatar">A</div>
    <div>
      <div class="profile-name" id="profileName">Loading…</div>
      <div class="profile-username" id="profileUsername"></div>
      <div id="verifiedBadge" hidden class="profile-verified"><i class="ti ti-badge-check"></i> Verified</div>
      <div id="pendingBadge" hidden class="profile-pending"><i class="ti ti-clock"></i> Verification pending</div>
    </div>
  </div>

  <div id="successMsg" class="success-msg" hidden></div>
  <div id="profileError" class="auth-error" style="margin:0 14px 12px" hidden></div>

  <!-- ── VIEW MODE ── -->
  <div id="viewMode">

    <!-- Photos -->
    <div class="section-title">Photos</div>
    <div class="photo-grid-profile" id="photoGridView"></div>

    <!-- Basic info -->
    <div class="section-title">About me</div>
    <div class="info-card">
      <div class="info-row"><span class="info-label"><i class="ti ti-calendar"></i> Age</span><span class="info-value" id="infoAge">—</span></div>
      <div class="info-row"><span class="info-label"><i class="ti ti-ruler-2"></i> Height</span><span class="info-value" id="infoHeight">—</span></div>
      <div class="info-row"><span class="info-label"><i class="ti ti-building-community"></i> Location</span><span class="info-value" id="infoLocation">—</span></div>
    </div>

    <!-- Lifestyle -->
    <div class="section-title">Lifestyle</div>
    <div class="info-card">
      <div class="info-row"><span class="info-label"><i class="ti ti-school"></i> Education</span><span class="info-value" id="infoEducation">—</span></div>
      <div class="info-row"><span class="info-label"><i class="ti ti-glass"></i> Drinking</span><span class="info-value" id="infoDrinking">—</span></div>
      <div class="info-row"><span class="info-label"><i class="ti ti-smoking"></i> Smoking</span><span class="info-value" id="infoSmoking">—</span></div>
      <div class="info-row"><span class="info-label"><i class="ti ti-baby-carriage"></i> Have kids</span><span class="info-value" id="infoHaveKids">—</span></div>
      <div class="info-row"><span class="info-label"><i class="ti ti-heart"></i> Want kids</span><span class="info-value" id="infoWantKids">—</span></div>
      <div class="info-row"><span class="info-label"><i class="ti ti-star"></i> Zodiac</span><span class="info-value" id="infoZodiac">—</span></div>
      <div class="info-row"><span class="info-label"><i class="ti ti-building-church"></i> Religion</span><span class="info-value" id="infoReligion">—</span></div>
    </div>

    <!-- Actions -->
    <button class="action-btn btn-verify" id="verifyActionBtn" hidden>
      <i class="ti ti-shield-check"></i> Verify my identity
    </button>
    <button class="action-btn btn-logout" id="logoutBtn">
      <i class="ti ti-logout"></i> Sign out
    </button>
  </div>

  <!-- ── EDIT MODE ── -->
  <div id="editMode" style="display:none">

    <!-- Edit photos -->
    <div class="section-title">Photos <span style="color:var(--tx3);font-size:10px;text-transform:none;letter-spacing:0">(tap × to remove, + to add)</span></div>
    <div class="photo-grid-profile" id="photoGridEdit"></div>
    <input type="file" id="photoInputEdit" accept="image/jpeg,image/png,image/webp" multiple style="display:none">

    <!-- Edit fields -->
    <div class="section-title">Basic details</div>
    <div style="padding:0 14px">
      <div class="field">
        <label class="field-label">Full name</label>
        <div class="field-wrap"><i class="ti ti-user field-icon"></i><input class="field-input" id="editName" type="text" placeholder="Your full name"></div>
      </div>
      <div class="field">
        <label class="field-label">City</label>
        <div class="field-wrap"><i class="ti ti-building-community field-icon"></i><input class="field-input" id="editCity" type="text" placeholder="Your city"></div>
      </div>
      <div class="field">
        <label class="field-label">Country</label>
        <div class="field-wrap"><i class="ti ti-world field-icon"></i><select class="field-input field-select" id="editCountry"><option value="">Select…</option></select></div>
      </div>
      <div class="field">
        <label class="field-label">Height</label>
        <div class="field-wrap"><i class="ti ti-ruler-2 field-icon"></i><select class="field-input field-select" id="editHeight"><option value="">Select…</option></select></div>
      </div>
    </div>

    <div class="section-title">Lifestyle</div>
    <div style="padding:0 14px">
      <div class="field">
        <label class="field-label">Education</label>
        <div class="field-wrap"><i class="ti ti-school field-icon"></i>
          <select class="field-input field-select" id="editEducation">
            <option value="">Select…</option>
            <option value="high-school">High school</option>
            <option value="some-college">Some college</option>
            <option value="bachelors">Bachelor's degree</option>
            <option value="masters">Master's degree</option>
            <option value="phd">PhD / Doctorate</option>
            <option value="trade-school">Trade / Vocational school</option>
            <option value="prefer-not-to-say">Prefer not to say</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label class="field-label">Drinking</label>
        <div class="field-wrap"><i class="ti ti-glass field-icon"></i>
          <select class="field-input field-select" id="editDrinking">
            <option value="">Select…</option>
            <option value="yes">Yes</option>
            <option value="socially">Socially</option>
            <option value="no">No</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label class="field-label">Smoking</label>
        <div class="field-wrap"><i class="ti ti-smoking field-icon"></i>
          <select class="field-input field-select" id="editSmoking">
            <option value="">Select…</option>
            <option value="yes">Yes</option>
            <option value="no">No</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label class="field-label">Have kids</label>
        <div class="field-wrap"><i class="ti ti-baby-carriage field-icon"></i>
          <select class="field-input field-select" id="editHaveKids">
            <option value="">Select…</option>
            <option value="yes">Yes</option>
            <option value="no">No</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label class="field-label">Want kids</label>
        <div class="field-wrap"><i class="ti ti-heart field-icon"></i>
          <select class="field-input field-select" id="editWantKids">
            <option value="">Select…</option>
            <option value="yes">Yes</option>
            <option value="no">No</option>
            <option value="open">Open to it</option>
            <option value="not-sure">Not sure</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label class="field-label">Zodiac sign</label>
        <div class="field-wrap"><i class="ti ti-star field-icon"></i>
          <select class="field-input field-select" id="editZodiac">
            <option value="">Select…</option>
            <option value="aries">♈ Aries</option>
            <option value="taurus">♉ Taurus</option>
            <option value="gemini">♊ Gemini</option>
            <option value="cancer">♋ Cancer</option>
            <option value="leo">♌ Leo</option>
            <option value="virgo">♍ Virgo</option>
            <option value="libra">♎ Libra</option>
            <option value="scorpio">♏ Scorpio</option>
            <option value="sagittarius">♐ Sagittarius</option>
            <option value="capricorn">♑ Capricorn</option>
            <option value="aquarius">♒ Aquarius</option>
            <option value="pisces">♓ Pisces</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label class="field-label">Religion</label>
        <div class="field-wrap"><i class="ti ti-building-church field-icon"></i>
          <select class="field-input field-select" id="editReligion">
            <option value="">Select…</option>
            <option value="christianity">Christianity</option>
            <option value="islam">Islam</option>
            <option value="hinduism">Hinduism</option>
            <option value="judaism">Judaism</option>
            <option value="buddhism">Buddhism</option>
            <option value="sikhism">Sikhism</option>
            <option value="spiritual">Spiritual but not religious</option>
            <option value="agnostic">Agnostic</option>
            <option value="atheist">Atheist</option>
            <option value="other">Other</option>
            <option value="prefer-not-to-say">Prefer not to say</option>
          </select>
        </div>
      </div>
    </div>

    <div style="padding:0 14px 24px;display:flex;gap:10px">
      <button class="action-btn btn-cancel" id="cancelEditBtn" style="margin:0;flex:1">Cancel</button>
      <button class="action-btn btn-save" id="saveBtn" style="margin:0;flex:2">
        <span id="saveLabel">Save changes</span>
        <span id="saveSpinner" class="spinner" hidden></span>
      </button>
    </div>
  </div>

</div>

<script src="/js/auth.js"></script>
<script src="/js/sw-register.js"></script>
<script src="/js/profile-page.js"></script>
</body>
</html>
