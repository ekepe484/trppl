<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a1a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trppl">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/favicon.png">
<title>Sign In — Trppl</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/auth.css">
<link rel="stylesheet" href="/css/register.css">
</head>
<body>
<div class="phone auth-phone">
  <div class="auth-header">
    <div style="display:flex;flex-direction:column;align-items:center;gap:0">
  <svg width="72" height="52" viewBox="0 0 680 280" role="img" xmlns="http://www.w3.org/2000/svg" aria-label="Trppl logo">
    <polygon points="248,228 308,112 368,228" fill="#f472b6"/>
    <polygon points="312,228 372,112 432,228" fill="#38bdf8"/>
    <polygon points="280,228 340,84 400,228" fill="#7c3aed"/>
    <polygon points="315,160 340,104 365,160" fill="#a78bfa" opacity="0.3"/>
    <circle cx="310" cy="178" r="4" fill="#fff" opacity="0.55"/>
    <circle cx="370" cy="178" r="4" fill="#fff" opacity="0.55"/>
  </svg>
  <div style="color:#fff;font-size:22px;font-weight:800;letter-spacing:0.22em;line-height:1">TRPPL</div>
  <div style="color:#a78bfa;font-size:11px;letter-spacing:0.18em;margin-top:4px">match · compete · date</div>
</div>
  </div>

  <div class="auth-body">
    <h1 class="auth-title">Welcome back</h1>
    <p class="auth-sub">Sign in with your email or phone number.</p>

    <div id="formError" class="auth-error" hidden></div>

    <div class="contact-toggle" style="margin-bottom:20px">
      <button class="ctog active" id="ltog-email"><i class="ti ti-mail"></i> Email</button>
      <button class="ctog" id="ltog-phone"><i class="ti ti-phone"></i> Phone</button>
    </div>

    <div class="field">
      <label class="field-label" for="contact" id="contactLabel">Email address</label>
      <div class="field-wrap">
        <i class="ti ti-mail field-icon" id="contactIcon"></i>
        <input class="field-input" id="contact" type="email" placeholder="you@example.com" autocomplete="email">
      </div>
    </div>

    <div class="field">
      <label class="field-label" for="password">Password</label>
      <div class="field-wrap">
        <i class="ti ti-lock field-icon"></i>
        <input class="field-input" id="password" type="password" placeholder="Your password" autocomplete="current-password">
        <button type="button" class="field-toggle" id="btn-pw-toggle"><i class="ti ti-eye" id="pwIcon"></i></button>
      </div>
    </div>

    <button class="auth-btn" id="loginBtn">
      <span id="loginLabel">Sign in</span>
      <span id="loginSpinner" class="spinner" hidden></span>
    </button>

    <div class="auth-divider">Don't have an account? <a href="/pages/register.html" class="auth-link">Register</a></div>
  </div>
</div>

<script src="/js/auth.js"></script>
<script src="/js/sw-register.js"></script>
<script src="/js/login-page.js"></script>
</body>
</html>
