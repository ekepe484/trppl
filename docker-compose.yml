version: '3.9'

services:

  # ── PostgreSQL database ──────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: trppl-db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       trppl
      POSTGRES_USER:     trppl_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"          # remove this line in production
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trppl_user -d trppl"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Trppl application ────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trppl-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV:             production
      PORT:                 3000
      DATABASE_URL:         postgres://trppl_user:${DB_PASSWORD:-changeme}@db:5432/trppl
      JWT_SECRET:           ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN:       7d
      ANTHROPIC_API_KEY:    ${ANTHROPIC_API_KEY:-}
      ALLOWED_ORIGINS:      ${ALLOWED_ORIGINS:-http://localhost:3000}
      EMAIL_HOST:           ${EMAIL_HOST:-smtp.ethereal.email}
      EMAIL_PORT:           ${EMAIL_PORT:-587}
      EMAIL_SECURE:         ${EMAIL_SECURE:-false}
      EMAIL_USER:           ${EMAIL_USER:-}
      EMAIL_PASS:           ${EMAIL_PASS:-}
      EMAIL_FROM:           ${EMAIL_FROM:-Trppl <no-reply@trppl.app>}
      TWILIO_ACCOUNT_SID:   ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN:    ${TWILIO_AUTH_TOKEN:-}
      TWILIO_PHONE_NUMBER:  ${TWILIO_PHONE_NUMBER:-}
      TWILIO_DEV_MODE:      ${TWILIO_DEV_MODE:-true}
      UPLOAD_DIR:           /app/uploads
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "${PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  # ── pgAdmin (optional — comment out if not needed) ───────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: trppl-pgadmin
    restart: unless-stopped
    profiles: ["admin"]      # only starts with: docker compose --profile admin up
    depends_on:
      - db
    environment:
      PGADMIN_DEFAULT_EMAIL:    admin@trppl.app
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
  uploads_data:
  pgadmin_data:
